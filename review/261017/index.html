<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>So Far Away｜261017 調整截圖</title><style>body{margin:0;background:#101713;color:#eee8d9;font-family:system-ui,sans-serif;line-height:1.8}main{max-width:1100px;margin:auto;padding:40px 20px}h1{font-size:clamp(28px,5vw,44px);line-height:1.3}a{color:#e2c186}figure{margin:48px 0;border-top:1px solid #4c5143;padding-top:24px}img{display:block;max-width:100%;max-height:850px;height:auto;margin:20px auto}small{color:#b8bda9}figcaption{max-width:75ch}</style><main><p>261017 PLAYTEST UPDATE</p><h1>So Far Away<br>玩後調整截圖</h1><p><a href="../../">開啟試玩版</a> · <a href="../../downloads/soufa-review-20261017.zip">下載 11 張截圖與圖說</a></p><p>本頁為未修圖的瀏覽器截圖。證物及法庭預覽使用隔離瀏覽器的展示進度；完整流程另有三案驗收。影片目前仍為示意影像，等待企劃方提供自攝版本。</p><figure><figcaption><h2>三案選單</h2><p>三份卷宗改為 KTV、DNA 鑑定、少年鬥毆；從首頁選案進入。</p></figcaption><a href="01-cases.png"><img loading="lazy" src="01-cases.png" alt="三案選單"></a></figure><figure><figcaption><h2>開始前先說明流程</h2><p>先說明移動、互動、蒐證與進庭條件。此處規則說明仍可替換為企劃方提供的正式文案。</p></figcaption><a href="02-rules.png"><img loading="lazy" src="02-rules.png" alt="開始前先說明流程"></a></figure><figure><figcaption><h2>2D 現場調查</h2><p>阿生案改為四件證物；收齊本案證物後才出現進入法庭的按鈕。</p></figcaption><a href="03-investigation.png"><img loading="lazy" src="03-investigation.png" alt="2D 現場調查"></a></figure><figure><figcaption><h2>一問一答與追問選項</h2><p>可在第一輪結束，或繼續追問；對話字型、行距與選項重新排版。</p></figcaption><a href="04-dialogue.png"><img loading="lazy" src="04-dialogue.png" alt="一問一答與追問選項"></a></figure><figure><figcaption><h2>只保存實際問到的證詞</h2><p>第一輪結束後，紀錄只含已問到的內容；自動收錄，底部可直接進入下一個證據。</p></figcaption><a href="05-evidence.png"><img loading="lazy" src="05-evidence.png" alt="只保存實際問到的證詞"></a></figure><figure><figcaption><h2>DNA 案的證物閱讀頁</h2><p>直接閱讀報告圖像，移除證物頁額外的解讀提示、綠框與圖片標記方塊。</p><small>使用展示進度的介面預覽</small></figcaption><a href="06-dna.png"><img loading="lazy" src="06-dna.png" alt="DNA 案的證物閱讀頁"></a></figure><figure><figcaption><h2>少年案的指認照片</h2><p>照片與五枚指印完整呈現；選一人或「都不選」都能繼續調查。</p><small>使用展示進度的介面預覽</small></figcaption><a href="07-youth.png"><img loading="lazy" src="07-youth.png" alt="少年案的指認照片"></a></figure><figure><figcaption><h2>法庭：依原稿逐句發言</h2><p>三案共十輪爭點，依文件的檢辯內容與順序發言；先聽完雙方，再選擇採信或保留。</p><small>使用展示進度的介面預覽</small></figcaption><a href="08-court-desktop.png"><img loading="lazy" src="08-court-desktop.png" alt="法庭：依原稿逐句發言"></a></figure><figure><figcaption><h2>手機法庭與文字框</h2><p>手機將人物排在發言上方，正文使用完整寬度；長文與操作按鈕保留在各自框內。</p><small>使用展示進度的介面預覽</small></figcaption><a href="09-court-mobile.png"><img loading="lazy" src="09-court-mobile.png" alt="手機法庭與文字框"></a></figure><figure><figcaption><h2>檢辯後直接判決</h2><p>拿掉判決理由勾選與二次確認，直接選擇有罪／無罪。</p><small>使用展示進度的介面預覽</small></figcaption><a href="10-direct-verdict.png"><img loading="lazy" src="10-direct-verdict.png" alt="檢辯後直接判決"></a></figure><figure><figcaption><h2>少年案新增人物選擇</h2><p>人物 1–6 與「都不選」共七個選項，手機兩欄排列。</p><small>使用展示進度的介面預覽</small></figcaption><a href="11-identification-choice.png"><img loading="lazy" src="11-identification-choice.png" alt="少年案新增人物選擇"></a></figure></main></html>
